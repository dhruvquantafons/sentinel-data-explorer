<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraVerify — Login</title>
    <meta name="description" content="Sign in to TeraVerify satellite verification platform.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

    <!-- Animated background orbs -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- Grid overlay -->
    <div class="grid-overlay" aria-hidden="true"></div>

    <main class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="logo-ring">
                    <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="28" height="28" rx="6" stroke="currentColor" stroke-width="2"/>
                        <circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="2"/>
                        <path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
            </div>

            <h1 class="login-title">TeraVerify</h1>
            <p class="login-subtitle">Satellite Verification Platform</p>

            <!-- Login form -->
            <form id="login-form" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" name="username" class="form-input"
                               placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="Enter your password" required>
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="Show password">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="error-message" class="error-message hidden">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <span>Invalid username or password</span>
                </div>

                <button type="submit" id="login-btn" class="login-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader hidden">
                        <div class="spinner"></div>
                    </div>
                </button>
            </form>

            <div class="login-footer">
                <p class="demo-hint">Demo credentials: <code>admin</code> / <code>admin</code></p>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorMsg = document.getElementById("error-message");
        const loginBtn = document.getElementById("login-btn");
        const togglePwd = document.getElementById("toggle-password");

        // Toggle password visibility
        togglePwd.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            togglePwd.querySelector(".eye-open").classList.toggle("hidden");
            togglePwd.querySelector(".eye-closed").classList.toggle("hidden");
        });

        // Clear error on input
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener("input", () => {
                errorMsg.classList.add("hidden");
            });
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.classList.add("hidden");

            const btnText = loginBtn.querySelector(".btn-text");
            const btnLoader = loginBtn.querySelector(".btn-loader");
            btnText.classList.add("hidden");
            btnLoader.classList.remove("hidden");
            loginBtn.disabled = true;

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput.value.trim(),
                        password: passwordInput.value,
                    }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Success animation
                    document.querySelector(".login-card").classList.add("success");
                    setTimeout(() => {
                        window.location.href = "/app";
                    }, 600);
                } else {
                    errorMsg.classList.remove("hidden");
                    loginBtn.classList.add("shake");
                    setTimeout(() => loginBtn.classList.remove("shake"), 500);
                }
            } catch (err) {
                errorMsg.querySelector("span").textContent = "Connection error. Please try again.";
                errorMsg.classList.remove("hidden");
            } finally {
                btnText.classList.remove("hidden");
                btnLoader.classList.add("hidden");
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
